<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medtronics Teleconsultation Doctor Portal</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body { max-width: 900px; margin: 0 auto; padding: 2rem; }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; }
    .emergency-feed { width: 100%; margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem; }
    .alert-card-doctor { background: rgba(239, 68, 68, 0.2); border: 2px solid #ef4444; border-radius: 0.75rem; padding: 1.25rem; display: flex; justify-content: space-between; align-items: center; }
    .alert-details h4 { color: #fca5a5; margin-bottom: 0.3rem; }
    .alert-details p { color: #f8fafc; font-size: 0.95rem; }
    .btn-join { background: #ef4444; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; }
    .btn-join:hover { background: #dc2626; }
    .connection-status { padding: 0.3rem 0.8rem; border-radius: 1rem; font-size: 0.8rem; background: #059669; color: white; }
  </style>
</head>
<body>
  <div class="dashboard-header">
    <div>
      <h2>👨‍⚕️ Clinician Teleconsultation Emergency Portal</h2>
      <p style="color: var(--text-muted);">Real-time red-flag patient escalation feed</p>
    </div>
    <span id="connStatus" class="connection-status">Connected to Teleconsult WS</span>
  </div>

  <div id="emergencyFeed" class="emergency-feed">
    <div id="noAlerts" style="text-align: center; color: var(--text-muted); padding: 3rem;">
      No active emergency escalations. Monitoring voice pipeline...
    </div>
  </div>

  <script>
    const feed = document.getElementById('emergencyFeed');
    const noAlerts = document.getElementById('noAlerts');
    const connStatus = document.getElementById('connStatus');

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws/clinician`;
    const ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      connStatus.innerText = 'Connected (Live Monitoring)';
      connStatus.style.background = '#059669';
    };

    ws.onclose = () => {
      connStatus.innerText = 'Disconnected';
      connStatus.style.background = '#ef4444';
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (noAlerts) noAlerts.style.display = 'none';

      // Play emergency chime alert
      const chime = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
      chime.play().catch(() => {});

      const card = document.createElement('div');
      card.className = 'alert-card-doctor';
      card.innerHTML = `
        <div class="alert-details">
          <h4>🚨 Red Flag: ${data.red_flag_rule} (${data.language})</h4>
          <p><strong>Patient ID:</strong> ${data.patient_id} | <strong>Time:</strong> ${data.timestamp}</p>
          <p style="margin-top: 0.4rem;"><strong>Transcript:</strong> "${data.transcript}"</p>
          <p style="color: #fca5a5; font-size: 0.85rem; margin-top: 0.2rem;">Matched Keyword: ${data.matched_keyword}</p>
        </div>
        <button class="btn-join" onclick="alert('Joining priority teleconsultation session for ${data.patient_id}...')">Join Call</button>
      `;

      feed.prepend(card);
    };
  </script>
</body>
</html>
